[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-a1"
version = "0.1.0"
description = "Explainable image and conversation forensics for Project A1"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.1"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["calibration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
