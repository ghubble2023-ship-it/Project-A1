name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify a face detector is available
        # Guards the OpenCV 5 regression: the bundled Haar cascades were
        # removed, which silently breaks every face-dependent module.
        run: |
          python -c "
          from sentinel.detect import shared_detector
          d = shared_detector()
          assert d.available, 'no face detector backend'
          print('face detector backend:', d.backend)
          "

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the CLI
        run: |
          python -m sentinel chat samples/pig_butchering.json | tail -20
          python -m sentinel chat samples/ordinary_chat.json | head -8
